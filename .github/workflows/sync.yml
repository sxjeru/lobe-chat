name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write
  # workflows: write

on:
  schedule:
    - cron: '0 22 * * *' # every 6 hours
  workflow_dispatch: {}

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.SYNC_PAT }}
          persist-credentials: true

      - name: Clean issue notice
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          # 确保 label 存在 / Ensure label exists
          gh label create "🚨 Sync Fail" --color "d73a4a" -R "$GITHUB_REPOSITORY" || true

          # 动态嗅探并清理遗留的失败提示 Issue
          for num in $(gh issue list -R "$GITHUB_REPOSITORY" --label "🚨 Sync Fail" --state open --json number --jq '.[].number'); do
            gh issue close "$num" --reason "completed" -R "$GITHUB_REPOSITORY"
          done

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: lobehub/lobehub
          upstream_sync_branch: canary
          target_sync_branch: canary
          target_repo_token: ${{ secrets.SYNC_PAT }}
          test_mode: false

      - name: Sync check
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          # 确保 label 存在 / Ensure label exists
          gh label create "🚨 Sync Fail" --color "d73a4a" -R "$GITHUB_REPOSITORY" || true

          # 仅在同步失败时创建报警 Issue
          gh issue create \
            -R "$GITHUB_REPOSITORY" \
            --title "🚨 同步失败 | Sync Fail" \
            --label "🚨 Sync Fail" \
            --body "Due to a change in the workflow file of the [LobeChat][lobechat] upstream repository, GitHub has automatically suspended the scheduled automatic update. You need to manually sync your fork. Please refer to the detailed [Tutorial][tutorial-en-US] for instructions.

            由于 [LobeChat][lobechat] 上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次，请查看 [详细教程][tutorial-zh-CN]

            ![](https://github-production-user-asset-6210df.s3.amazonaws.com/17870709/273954625-df80c890-0822-4ac2-95e6-c990785cbed5.png)

            [lobechat]: https://github.com/lobehub/lobe-chat
            [tutorial-zh-CN]: https://lobehub.com/zh/docs/self-hosting/advanced/upstream-sync
            [tutorial-en-US]: https://lobehub.com/docs/self-hosting/advanced/upstream-sync"
